# SmartAgent Nginx Configuration
# Acts as reverse proxy, serving frontend static files and proxying /api/ to the gateway.
# This eliminates CORS issues because the browser only communicates with a single origin.

upstream gateway {
    server gateway:8080;
}

server {
    listen 80;
    server_name _;

    # Gzip compression for static files
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # Frontend static files
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: non-API, non-asset requests go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API requests proxy to gateway
    location /api/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE support: disable buffering for streaming responses
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;

        # CORS headers as safety net
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-User-Id, X-Trace-Id, X-Device-Id, Device-Type" always;
        add_header Access-Control-Expose-Headers "Authorization, X-Trace-Id" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}

# WebSocket connection upgrade map (placed outside server block)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
