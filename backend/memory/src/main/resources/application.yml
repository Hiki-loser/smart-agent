server:
  port: 8086

spring:
  application:
    name: smart-agent-memory
  config:
    import:
      - optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/smart-agent-memory?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        enabled: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

rocketmq:
  name-server: ${ROCKETMQ_NAME_SRV:localhost:9876}
  producer:
    group: memory-producer-group
    send-message-timeout: 3000
  consumer:
    group: memory-consumer-group

memory:
  summary:
    trigger-round-threshold: 8
  context:
    recent-message-limit: 12

ai:
  model:
    api-key: ${AI_MODEL_API_KEY:}
    base-url: ${AI_MODEL_BASE_URL:https://api.deepseek.com}
    chat-model-name: ${AI_MODEL_CHAT_MODEL:deepseek-v4-pro}
    streaming-chat-model-name: ${AI_MODEL_STREAMING_MODEL:deepseek-v4-pro}
    embedding-model-name: ${AI_MODEL_EMBEDDING_MODEL:}
    temperature: 0.7
    timeout-seconds: 60
    max-retries: 3
    retry-delay-ms: 1000
